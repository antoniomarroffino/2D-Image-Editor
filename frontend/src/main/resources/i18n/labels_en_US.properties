HelpGuide.title=Editor 2D
HelpGuide.description=is an application that allows you to edit images through various operations. Supported formats include PNM.
HelpGuide.menuFile=File Menu:
HelpGuide.open=- Open: Allows you to load and view an image.
HelpGuide.recentFiles=- Recent Files: Allows you to open the last five loaded files.
HelpGuide.save=- Save: Saves the current image.
HelpGuide.saveAs=- Save As: Saves the image with a new name or in a different format.
HelpGuide.close=- Close: Closes the current image.
HelpGuide.exit=- Exit: Closes the application.
HelpGuide.menuEdit=Edit Menu:
HelpGuide.language=In the Language section, you can select the desired language. Changes will take effect after restarting the application.
HelpGuide.menuHelp=Help Menu:
HelpGuide.info=- Info: Displays information about the application, including the version, developers, name, and date of the last build.
HelpGuide.editOperations=Editing Operations:
HelpGuide.editingInfo=This section provides the editing operations available for the current image. Select an operation to apply it.
HelpGuide.pipeline=Pipeline of Operations:
HelpGuide.pipelineInfo=Shows the list of applied operations and those currently in progress. To execute the current pipeline, press the Run button in the upper right corner.
HelpGuide.infobar=Infobar:
HelpGuide.infobarInfo=This section displays feedback on the operations performed by the user.
HelpGuide.imageInfo=Image Information:
HelpGuide.imageInfoDetails=This section shows information about the current image, such as the name, format, size (width x height), and date of last modification. This information becomes visible once the image is loaded.
