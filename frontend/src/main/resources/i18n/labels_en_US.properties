HelpGuide.guide=**Editor 2D** is an application that allows you to edit images using various operations. The supported formats include **PNM**.\n\n**File Menu**: \n- **Open**: Allows you to load and view an image.\n- **Open Recent File**: Opens the last 5 recently loaded files.\n- **Save**: Saves the current image.\n- **Save As**: Saves the image with a new name or in a different format.\n- **Close**: Closes the current image.\n- **Exit**: Exits the application.\n\n**Edit Menu**: \nIn the **Language** section, you can select the desired language. Changes will take effect after restarting the application.\n\n**Help Menu**: \n- **Info**: Displays application information, including version, developers, name, and the latest build date.\n\n**Editing Operations**: \nThis section provides the available operations for editing the current image. Select an operation to apply it.\n\n**Operations Pipeline**: \nShows the list of applied and ongoing operations. To execute the current pipeline, press the **Run** button in the upper right corner.\n\n**Infobar**: \nThis section displays feedback on the operations performed by the user.\n\n**Current Image Info**: \nThis section shows information about the current image, such as the name, format, size (width x height), and the last modification date. These details become visible once the image is loaded.
