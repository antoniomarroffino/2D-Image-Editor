HelpGuide.infobarInfo=Questa sezione visualizza feedback sulle operazioni eseguite dall'utente.
HelpGuide.imageInfo=Informazioni sull'Immagine:
HelpGuide.imageInfoDetails=Questa sezione mostra informazioni sull'immagine corrente, come nome, formato, dimensione (larghezza x altezza) e data dell'ultima modifica. Queste informazioni diventano visibili una volta che l'immagine \u00E8 stata caricata.
