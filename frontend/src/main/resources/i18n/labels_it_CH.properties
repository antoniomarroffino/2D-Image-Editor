HelpGuide.title=Editor 2D
HelpGuide.description=Editor 2D \u00E8 un'applicazione che consente di modificare le immagini attraverso varie operazioni. I formati supportati includono PNM.
HelpGuide.menuFile=Menu File:
HelpGuide.open=- Apri: Consente di caricare e visualizzare un'immagine.
HelpGuide.recentFiles=- File Recenti: Consente di aprire gli ultimi cinque file caricati.
HelpGuide.save=- Salva: Salva l'immagine corrente.
HelpGuide.saveAs=- Salva come: Salva l'immagine con un nuovo nome o in un formato diverso.
HelpGuide.close=- Chiudi: Chiude l'immagine corrente.
HelpGuide.exit=- Esci: Chiude l'applicazione.
HelpGuide.menuEdit=Menu Modifica:
HelpGuide.language=Nella sezione Lingua, puoi selezionare la lingua desiderata. Le modifiche avranno effetto dopo il riavvio dell'applicazione.
HelpGuide.menuHelp=Menu Aiuto:
HelpGuide.info=- Info: Visualizza informazioni sull'applicazione, inclusi versione, sviluppatori, nome e data dell'ultima build.
HelpGuide.editOperations=Operazioni di Modifica:
HelpGuide.editingInfo=Questa sezione fornisce le operazioni di modifica disponibili per l'immagine corrente. Seleziona un'operazione per applicarla.
HelpGuide.pipeline=Pipeline di Operazioni:
HelpGuide.pipelineInfo=Mostra l'elenco delle operazioni applicate e quelle attualmente in corso. Per eseguire la pipeline corrente, premi il pulsante Esegui nell'angolo in alto a destra.
