HelpGuide.guide=**Editor 2D** \u00E8 un'applicazione che consente di modificare immagini tramite diverse operazioni. I formati supportati includono **PNM**.\n\n**Men\u00F9 File**: \n- **Apri**: Consente di caricare e visualizzare un'immagine.\n- **Apri file recente**: Permette di aprire gli ultimi 5 file caricati.\n- **Salva**: Salva l'immagine corrente.\n- **Salva come**: Salva l'immagine con un nuovo nome o in un formato diverso.\n- **Chiudi**: Chiude l'immagine corrente.\n- **Esci**: Chiude l'applicazione.\n\n**Men\u00F9 Modifica**: \nNella sezione **Lingua**, puoi selezionare la lingua desiderata. Le modifiche avranno effetto dopo il riavvio dell'applicazione.\n\n**Men\u00F9 Aiuto**: \n- **Info**: Visualizza le informazioni sull'applicazione, tra cui la versione, gli sviluppatori, il nome e la data dell'ultima build.\n\n**Operazioni di editing**: \nIn questa sezione sono disponibili le operazioni di modifica per l'immagine corrente. Seleziona un'operazione per applicarla.\n\n**Pipeline di operazioni**: \nMostra la lista delle operazioni applicate e quelle in corso. Per eseguire la pipeline corrente, premi il pulsante **Run** nell'angolo superiore destro.\n\n**Infobar**: \nQui vengono visualizzati i feedback sulle operazioni eseguite dall'utente.\n\n**Informazioni immagine**: \nQuesta sezione mostra informazioni sull'immagine corrente, come il nome, il formato, la dimensione (larghezza x altezza) e la data dell'ultima modifica. Queste informazioni diventano visibili una volta caricata l'immagine.
